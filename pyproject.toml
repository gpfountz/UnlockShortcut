[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "unlockshortcut"
version = "1.0.0"
description = "Run a macOS Shortcut after the first screen unlock each day."
requires-python = ">=3.11"
dependencies = ["pyobjc-framework-Cocoa>=11,<12"]

[project.scripts]
unlockshortcut = "unlockshortcut.daemon:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["Foundation", "PyObjCTools", "objc"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
extend-exclude = ["build", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
