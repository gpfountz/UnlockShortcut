[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "unlockshortcut"
dynamic = ["version"]
description = "Run macOS Shortcuts after the first screen unlock each day."
readme = "README.md"
authors = [{name = "Greg Pfountz"}]
license = "GPL-3.0-only"
license-files = [
  "LICENSE",
  "COPYRIGHT.md",
  "src/unlockshortcut/licenses/THIRD_PARTY_NOTICES.md",
  "src/unlockshortcut/licenses/third-party/*",
]
requires-python = ">=3.11"
dependencies = ["pyobjc-framework-Cocoa>=13.0,<14"]

[project.scripts]
unlockshortcut = "unlockshortcut.cli:main"

[tool.setuptools.dynamic]
version = {attr = "unlockshortcut._version.__version__"}

[tool.setuptools.package-data]
unlockshortcut = ["licenses/*", "licenses/third-party/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["Foundation", "PyObjCTools", "objc"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
extend-exclude = ["build", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
